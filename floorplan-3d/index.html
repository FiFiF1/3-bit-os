<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floor Plan 3D Replica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c1917;
      --paper: #f7f3ec;
      --accent: #2f5d50;
      --accent-soft: #d8e4df;
      --muted: #6b645c;
      --panel: rgba(247, 243, 236, 0.92);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: "DM Sans", sans-serif; background: #0f1412; color: var(--ink); }
    #app { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute; inset: 0; pointer-events: none;
      display: grid; grid-template-rows: auto 1fr auto;
      padding: clamp(16px, 3vw, 28px);
    }
    .top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    }
    .brand {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(28, 25, 23, 0.08);
      padding: 14px 18px 16px;
      max-width: min(420px, 88vw);
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    }
    .brand h1 {
      font-family: "Fraunces", serif;
      font-size: clamp(1.35rem, 2.4vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .brand p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
    }
    .controls {
      pointer-events: auto;
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end;
    }
    button {
      font: inherit;
      border: 1px solid rgba(28,25,23,0.12);
      background: var(--panel);
      color: var(--ink);
      padding: 10px 14px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: background 0.2s ease, transform 0.15s ease;
    }
    button:hover { background: #fff; transform: translateY(-1px); }
    button.active { background: var(--accent); color: #f7f3ec; border-color: var(--accent); }
    .legend {
      pointer-events: none;
      align-self: end;
      justify-self: start;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(28, 25, 23, 0.08);
      padding: 12px 14px;
      font-size: 0.82rem;
      color: var(--muted);
      max-width: min(340px, 90vw);
      box-shadow: 0 10px 30px rgba(0,0,0,0.14);
    }
    .legend strong { color: var(--ink); font-weight: 600; }
    .hint { margin-top: 4px; }
    @media (max-width: 640px) {
      .top { flex-direction: column; }
      .controls { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="hud">
      <div class="top">
        <div class="brand">
          <h1>House Floor Plan — 3D</h1>
          <p>Furnished interactive replica from the CubiCasa plan — beds, baths, kitchen, living, dining, laundry, and garage.</p>
        </div>
        <div class="controls">
          <button id="btn-orbit" class="active" type="button">Orbit</button>
          <button id="btn-top" type="button">Top view</button>
          <button id="btn-labels" class="active" type="button">Labels</button>
          <button id="btn-roof" type="button">Roof</button>
        </div>
      </div>
      <div></div>
      <div class="legend">
        <strong>Navigate:</strong> drag to orbit · scroll to zoom · right-drag to pan
        <div class="hint">Front door faces south · sliding door opens the family room north</div>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
